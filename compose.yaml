services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lpg
      POSTGRES_USER: lpg
      POSTGRES_PASSWORD: lpg
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lpg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lpg']
      interval: 5s
      retries: 10
volumes:
  lpg_data:
